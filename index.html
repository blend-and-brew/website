<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .shine {
      position: relative;
      display: inline-block;
      overflow: hidden;

      /* Original thick border */
      border: 8px solid #fff;
      border-radius: 12px;

      /* Padding around the image */
      padding: 12px;
      background: #080808;

      box-shadow:
        0 0 30px rgba(255,255,255,0.08),
        0 20px 60px rgba(0,0,0,0.5);
    }

    .shine img {
      display: block;
      max-width: calc(100vw - 120px);
      max-height: calc(100vh - 120px);
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* Soft glowing reflection */
    .shine::after {
      content: "";
      position: absolute;

      top: -70%;
      left: -80%;

      width: 80%;
      height: 240%;

      pointer-events: none;

      background: linear-gradient(
        115deg,
        transparent 0%,
        rgba(255,255,255,0.02) 20%,
        rgba(255,255,255,0.10) 35%,
        rgba(255,255,255,0.30) 50%,
        rgba(255,255,255,0.10) 65%,
        rgba(255,255,255,0.02) 80%,
        transparent 100%
      );

      filter: blur(35px);

      transform: translateX(-180%) rotate(10deg);

      animation: glowSweep 6s linear infinite;
    }

    @keyframes glowSweep {
      from {
        transform: translateX(-180%) rotate(10deg);
      }

      to {
        transform: translateX(350%) rotate(10deg);
      }
    }
  </style>
</head>

<body>

  <div class="shine">
    <img src="images/BB_ComingSoon.jpg" alt="Coming Soon">
  </div>

</body>
</html>
