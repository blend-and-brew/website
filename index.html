<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #080808;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
    overflow: hidden;
}


/* Image container */
.shine {
    position: relative;
    display: inline-block;
    overflow: hidden;

    border-radius: 18px;

    padding: 14px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.35),
            rgba(255,255,255,0.05)
        );

    box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        0 0 40px rgba(255,255,255,.08);

}


/* Image */
.shine img {

    display: block;

    max-width: calc(100vw - 120px);
    max-height: calc(100vh - 120px);

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 10px;
}


/* Moving light reflection */
.shine::after {

    content: "";

    position: absolute;

    top: -80%;
    left: -60%;

    width: 45%;
    height: 260%;


    background:
    linear-gradient(
        115deg,
        transparent 0%,
        rgba(255,255,255,0.02) 35%,
        rgba(255,255,255,0.35) 50%,
        rgba(255,255,255,0.08) 60%,
        transparent 100%
    );


    filter: blur(18px);

    transform:
        translateX(-250%)
        rotate(15deg);


    animation:
        shineSweep 9s ease-in-out infinite;

    pointer-events:none;

}


/* Slow premium sweep */
@keyframes shineSweep {

    0% {
        transform:
        translateX(-250%)
        rotate(15deg);
    }


    35% {
        transform:
        translateX(450%)
        rotate(15deg);
    }


    100% {

        transform:
        translateX(450%)
        rotate(15deg);

    }

}



/* Gentle glow */
.shine {

    animation:
    softGlow 6s ease-in-out infinite;

}


@keyframes softGlow {

    0%,
    100% {

        box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        0 0 30px rgba(255,255,255,.05);

    }


    50% {

        box-shadow:
        0 35px 90px rgba(0,0,0,.8),
        0 0 50px rgba(255,255,255,.12);

    }

}


</style>

</head>


<body>


<div class="shine">

    <img src="images/BB_ComingSoon.jpg" alt="Coming Soon">

</div>


</body>
</html>
