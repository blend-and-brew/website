<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #080808;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  box-sizing: border-box;
  overflow: hidden;
}


/* Image frame */
.shine {
  display: inline-block;

  border: 8px solid #fff;
  border-radius: 12px;

  padding: 12px;
  background: #080808;

  box-shadow:
    0 0 30px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.5);
}


.shine img {
  display: block;
  max-width: calc(100vw - 120px);
  max-height: calc(100vh - 260px);
  width: auto;
  height: auto;
  object-fit: contain;
}


/* Coffee Cup */

.cup {
  width: 120px;
  margin-top: 35px;
}


/* Rising coffee animation */

.coffee {
  animation: fillCup 4s ease forwards;
}


@keyframes fillCup {

  from {
    transform: translateY(130px);
  }

  to {
    transform: translateY(0);
  }

}


/* Steam */

.steam {
  opacity: 0;
  animation: steamRise 3s ease infinite;
}


@keyframes steamRise {

  0% {
    opacity: 0;
    transform: translateY(10px);
  }

  50% {
    opacity: 0.8;
  }

  100% {
    opacity: 0;
    transform: translateY(-25px);
  }

}


</style>
</head>


<body>


<div class="shine">
  <img src="images/BB_ComingSoon.jpg" alt="Coming Soon">
</div>



<!-- Coffee Cup SVG -->

<svg class="cup" viewBox="0 0 220 260">

<defs>
  <clipPath id="cupClip">
    <path d="
      M45 70 
      Q110 85 175 70
      L160 200
      Q110 230 60 200
      Z"/>
  </clipPath>
</defs>


<!-- Coffee -->
<g clip-path="url(#cupClip)">

  <rect
    class="coffee"
    x="0"
    y="80"
    width="220"
    height="160"
    fill="#6b3e26"/>

  <ellipse
    cx="110"
    cy="80"
    rx="70"
    ry="15"
    fill="#3f2115"/>

</g>


<!-- Cup -->
<path
d="
M45 70 
Q110 85 175 70
L160 200
Q110 230 60 200
Z"
fill="none"
stroke="#ffffff"
stroke-width="6"/>


<!-- Handle -->
<path
d="
M170 105
Q215 100 200 160
Q190 185 165 170"
fill="none"
stroke="#ffffff"
stroke-width="6"/>


<!-- Rim -->
<ellipse
cx="110"
cy="70"
rx="65"
ry="15"
fill="none"
stroke="#ffffff"
stroke-width="6"/>


<!-- Steam -->

<path class="steam"
d="M90 45 Q80 25 95 10"
stroke="#aaa"
stroke-width="4"
fill="none"/>

<path class="steam"
d="M125 45 Q115 25 130 10"
stroke="#aaa"
stroke-width="4"
fill="none"/>


</svg>


</body>
</html>
