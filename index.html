<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blend & Brew - Coming Soon</title>

<style>
    :root {
        --pointer-x: 50%;
        --pointer-y: 50%;
        --rotate-x: 0deg;
        --rotate-y: 0deg;
        --glow-opacity: 0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 30px;
        background: #030303;
        font-family: Arial, Helvetica, sans-serif;
    }

    .card-wrapper {
        position: relative;
        width: min(90vw, 650px);
        perspective: 1100px;
        touch-action: none;
    }

    .glow {
        position: absolute;
        inset: -40px;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(circle at var(--pointer-x) var(--pointer-y),
            rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.10) 18%, transparent 55%);
        filter: blur(34px);
        opacity: var(--glow-opacity);
        transition: opacity 320ms ease;
    }

    .frame {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 18px;
        border: 4px solid #ffffff;
        border-radius: 5px;
        background: #050505;
        overflow: hidden;
        transform-style: preserve-3d;
        transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y));
        transition: box-shadow 220ms ease;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72);
        will-change: transform;
    }

    .card-wrapper.active .frame {
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
    }

    .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(circle at var(--pointer-x) var(--pointer-y),
            rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.08) 20%, transparent 52%);
        mix-blend-mode: screen;
        opacity: var(--glow-opacity);
        transition: opacity 320ms ease;
    }

    .frame::after {
        content: "";
        position: absolute;
        inset: -45%;
        z-index: 3;
        pointer-events: none;
        background: linear-gradient(115deg,
            transparent 38%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.22) 50%,
            rgba(255,255,255,0.05) 55%, transparent 62%);
        transform: translateX(-55%) rotate(8deg);
        opacity: 0;
    }

    .card-wrapper.active .frame::after {
        animation: sweep 1.4s ease forwards;
    }

    .frame img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: auto;
        transform: translateZ(18px) scale(1.012);
        filter: saturate(0.95) contrast(1.04);
        user-select: none;
        -webkit-user-drag: none;
    }

    /* Mobile "enable tilt" prompt (iOS requires a tap to grant motion permission) */
    .tilt-enable {
        position: absolute;
        left: 50%;
        bottom: -46px;
        transform: translateX(-50%);
        z-index: 4;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        letter-spacing: 0.02em;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        display: none;
        transition: opacity 240ms ease, background 200ms ease;
    }

    .tilt-enable:active { background: rgba(255, 255, 255, 0.14); }
    .tilt-enable.visible { display: inline-block; }

    @keyframes sweep {
        0% { transform: translateX(-60%) rotate(8deg); opacity: 0; }
        18% { opacity: 0.75; }
        100% { transform: translateX(60%) rotate(8deg); opacity: 0; }
    }

    @media (max-width: 600px) {
        body { padding: 18px; }
        .frame { padding: 10px; border-width: 3px; }
        .glow { inset: -24px; filter: blur(26px); }
    }

    @media (prefers-reduced-motion: reduce) {
        .frame, .glow, .frame::before, .frame::after {
            transition: none;
            animation: none !important;
        }
    }
</style>
</head>

<body>

<div class="card-wrapper" id="card">
    <div class="glow"></div>

    <div class="frame">
        <img src="images/BB_ComingSoon.webp" alt="Blend & Brew Coming Soon">
    </div>

    <button class="tilt-enable" id="tiltEnableBtn" type="button">Tap to enable tilt</button>
</div>

<script>
    const card = document.getElementById('card');
    const tiltEnableBtn = document.getElementById('tiltEnableBtn');
    const maxTilt = 8;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- Smooth, interpolated animation loop ----
    const state = {
        targetX: 50, targetY: 50, targetRX: 0, targetRY: 0,
        curX: 50, curY: 50, curRX: 0, curRY: 0,
        glowTarget: 0, glowCur: 0
    };

    const EASE = 0.14; // lower = smoother/slower, higher = snappier

    function lerp(a, b, t) { return a + (b - a) * t; }

    function tick() {
        state.curX = lerp(state.curX, state.targetX, EASE);
        state.curY = lerp(state.curY, state.targetY, EASE);
        state.curRX = lerp(state.curRX, state.targetRX, EASE);
        state.curRY = lerp(state.curRY, state.targetRY, EASE);
        state.glowCur = lerp(state.glowCur, state.glowTarget, EASE);

        card.style.setProperty('--pointer-x', `${state.curX.toFixed(2)}%`);
        card.style.setProperty('--pointer-y', `${state.curY.toFixed(2)}%`);
        card.style.setProperty('--rotate-x', `${state.curRX.toFixed(2)}deg`);
        card.style.setProperty('--rotate-y', `${state.curRY.toFixed(2)}deg`);
        card.style.setProperty('--glow-opacity', state.glowCur.toFixed(3));

        requestAnimationFrame(tick);
    }

    if (!reducedMotion) requestAnimationFrame(tick);

    function setTarget(percentX, percentY, glow = 1) {
        percentX = Math.max(0, Math.min(100, percentX));
        percentY = Math.max(0, Math.min(100, percentY));

        state.targetX = percentX;
        state.targetY = percentY;
        state.targetRY = ((percentX - 50) / 50) * maxTilt;
        state.targetRX = -((percentY - 50) / 50) * maxTilt;
        state.glowTarget = glow;
    }

    function resetTarget() {
        state.targetX = 50;
        state.targetY = 50;
        state.targetRX = 0;
        state.targetRY = 0;
        state.glowTarget = 0;
    }

    // ---- Desktop / mouse & touch pointer tilt ----
    function updateFromPointer(clientX, clientY) {
        const rect = card.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        setTarget((x / rect.width) * 100, (y / rect.height) * 100, 1);
    }

    card.addEventListener('pointerenter', event => {
        card.classList.add('active');
        updateFromPointer(event.clientX, event.clientY);
    });

    card.addEventListener('pointermove', event => {
        updateFromPointer(event.clientX, event.clientY);
    });

    card.addEventListener('pointerleave', () => {
        card.classList.remove('active');
        resetTarget();
    });

    // ---- Mobile device tilt (gyroscope) ----
    let gyroActive = false;
    const gyroMaxAngle = 22; // degrees of physical tilt mapped to full maxTilt

    function handleOrientation(event) {
        if (event.beta === null || event.gamma === null) return;

        const beta = Math.max(-gyroMaxAngle, Math.min(gyroMaxAngle, event.beta - 45));
        const gamma = Math.max(-gyroMaxAngle, Math.min(gyroMaxAngle, event.gamma));

        const percentX = 50 + (gamma / gyroMaxAngle) * 50;
        const percentY = 50 + (beta / gyroMaxAngle) * 50;

        if (!gyroActive) {
            gyroActive = true;
            card.classList.add('active');
        }

        setTarget(percentX, percentY, 0.85);
    }

    function enableGyro() {
        window.addEventListener('deviceorientation', handleOrientation);
        tiltEnableBtn.classList.remove('visible');
    }

    const supportsDeviceOrientation = 'DeviceOrientationEvent' in window;
    const needsPermission = supportsDeviceOrientation &&
        typeof DeviceOrientationEvent.requestPermission === 'function';
    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

    if (supportsDeviceOrientation && isTouchDevice && !reducedMotion) {
        if (needsPermission) {
            tiltEnableBtn.classList.add('visible');
            tiltEnableBtn.addEventListener('click', () => {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') enableGyro();
                        else tiltEnableBtn.classList.remove('visible');
                    })
                    .catch(() => tiltEnableBtn.classList.remove('visible'));
            });
        } else {
            enableGyro();
        }
    }
</script>

</body>
</html>
