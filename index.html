<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #080808;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
    overflow: hidden;
}

.shine {
    position: relative;
    display: inline-block;
    overflow: hidden;

    /* Border */
    border: 2px solid #fff;
    border-radius: 12px;

    /* Space around image */
    padding: 12px;
    background: #080808;

    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.shine img {
    display: block;
    max-width: calc(100vw - 120px);
    max-height: calc(100vh - 120px);
    width: auto;
    height: auto;
    object-fit: contain;
}

/* Animated shine */
.shine::after {
    content: "";
    position: absolute;

    top: -50%;
    left: -50%;

    width: 40%;
    height: 200%;

    pointer-events: none;

    background: linear-gradient(
        115deg,
        transparent 0%,
        rgba(255,255,255,0.02) 30%,
        rgba(255,255,255,0.12) 45%,
        rgba(255,255,255,0.35) 50%,
        rgba(255,255,255,0.12) 55%,
        rgba(255,255,255,0.02) 70%,
        transparent 100%
    );

    filter: blur(10px);

    transform: translateX(-220%) rotate(12deg);

    animation: shineSweep 8s ease-in-out infinite;
}

@keyframes shineSweep {

    /* Wait */
    0%,
    70% {
        transform: translateX(-220%) rotate(12deg);
    }

    /* Sweep across */
    100% {
        transform: translateX(420%) rotate(12deg);
    }
}
</style>
</head>

<body>

<div class="shine">
    <img src="images/BB_ComingSoon.jpg" alt="Coming Soon">
</div>

</body>
</html>
