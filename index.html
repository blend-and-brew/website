<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #080808;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  box-sizing: border-box;
  overflow: hidden;
}


/* Image frame */
.shine {
  display: inline-block;

  border: 8px solid #fff;
  border-radius: 12px;

  padding: 12px;
  background: #080808;

  box-shadow:
    0 0 30px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.5);
}


.shine img {
  display: block;
  max-width: calc(100vw - 120px);
  max-height: calc(100vh - 260px);
  width: auto;
  height: auto;
  object-fit: contain;
}


/* Coffee Cup */

<title>Coffee Cup Loader</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader-wrap {
    width: 120px;
    height: 120px;
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Cup outline, handle, saucer - static white linework */
  .cup-line {
    fill: none;
    stroke: #ffffff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Coffee fill - animates upward inside the clip */
  .coffee-fill {
    fill: #ffffff;
    animation: fillCup 3s ease-in-out infinite;
  }

  /* Steam wisps */
  .steam {
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.5;
    stroke-linecap: round;
    opacity: 0;
    transform-origin: center bottom;
    animation: steamRise 3s ease-in-out infinite;
  }

  .steam.s2 { animation-delay: 0.4s; }
  .steam.s3 { animation-delay: 0.8s; }

  @keyframes fillCup {
    0%   { transform: translateY(34px); }
    70%  { transform: translateY(34px); }
    85%  { transform: translateY(0px); }
    100% { transform: translateY(0px); }
  }

  @keyframes steamRise {
    0%   { opacity: 0; transform: translateY(0) scaleY(1); }
    10%  { opacity: 0; }
    75%  { opacity: 0; }
    88%  { opacity: 0.9; transform: translateY(-4px) scaleY(1.05); }
    100% { opacity: 0; transform: translateY(-14px) scaleY(1.1); }
  }
</style>
</head>
<body>

<div class="loader-wrap">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

    <!-- Clip path matches the inner cup shape so the fill never spills over the rim -->
    <defs>
      <clipPath id="cupClip">
        <path d="M28 38 L30 78 Q30 84 36 84 L60 84 Q66 84 66 78 L68 38 Z" />
      </clipPath>
    </defs>

    <!-- Steam -->
    <path class="steam s1" d="M40 26 Q36 20 40 15 Q44 10 40 4" />
    <path class="steam s2" d="M50 26 Q46 20 50 15 Q54 10 50 4" />
    <path class="steam s3" d="M60 26 Q56 20 60 15 Q64 10 60 4" />

    <!-- Coffee fill, clipped to cup interior, animated vertically -->
    <g clip-path="url(#cupClip)">
      <rect class="coffee-fill" x="26" y="40" width="44" height="44" />
    </g>

    <!-- Cup body outline -->
    <path class="cup-line" d="M28 38 L30 78 Q30 84 36 84 L60 84 Q66 84 66 78 L68 38 Z" />

    <!-- Cup rim -->
    <ellipse class="cup-line" cx="48" cy="38" rx="20" ry="5" />

    <!-- Handle -->
    <path class="cup-line" d="M68 46 Q82 46 82 58 Q82 70 68 70" />

    <!-- Saucer -->
    <ellipse class="cup-line" cx="48" cy="90" rx="30" ry="4" />

  </svg>
</div>

</body>
</html>
